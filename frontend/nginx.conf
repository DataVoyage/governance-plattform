server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Sprachpfad-Routing (Architektur 9.2) laeuft clientseitig: jede unbekannte
  # URL liefert die Anwendung aus, die dann selbst die Route aufloest.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
