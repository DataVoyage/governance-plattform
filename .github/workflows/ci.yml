name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Registry-Ziel ist konfigurierbar, nicht im Code verankert (Architektur 6.5).
  GP_IMAGE_REGISTRY: ${{ vars.GP_IMAGE_REGISTRY || 'localhost:5000' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrationen vorwaerts und rueckwaerts
        env:
          GP_DATABASE_URL: sqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: Tests mit Mindestabdeckung 90 %
        run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typprüfung und Build
        run: npm run build
      - name: Tests mit Mindestabdeckung 90 %
        run: npm run coverage

  oberflaeche:
    # Oberflaechentests laufen ausschliesslich headless (Playwright/Chromium).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-groups --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    # Abnahmekriterium 1.6: alle drei Images bauen gegen ein umkonfiguriertes
    # Registry-Ziel, ohne Codeaenderung — nur ueber die ENV-Variable.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        registry: ["localhost:5000", "registry.intern.beispiel-ag.de/governance"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend-Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ matrix.registry }}/governance-backend:${{ github.sha }}
      - name: Sync-Worker-Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: ${{ matrix.registry }}/governance-sync-worker:${{ github.sha }}
      - name: Frontend-Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ${{ matrix.registry }}/governance-frontend:${{ github.sha }}
